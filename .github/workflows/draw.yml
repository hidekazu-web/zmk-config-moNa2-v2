name: "Draw ZMK Keymap"

on:
  workflow_dispatch:
  # push時に自動で実行する場合は、以下のコメントアウトを外す
  push:
    paths:
      - "config/mona2.keymap"
      - "keymap_drawer.config.yaml"
      - "config/mona2.dtsi"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@f9cf9d3677368a7fb1dc505c51b8156fafa66fe2
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message || 'Update keymap drawing' }}"
      amend_commit: false
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap_drawer.config.yaml" # config file, ignored if not exists
      # keymap-drawer/draw.sh と同じ引数にしておく。L4 と BLE は見出しに押し方を書くため名前を付け替える
      # 空きレイヤー (L5〜L8・SCROLL) は描かない。コンボは keymap から読めないので別ファイルで足す
      parse_args: "mona2:'--layer-names BASE SYM NUM NAV L4（左親指の「-」を押したまま、右親指の「SPACE」を押す） L5 L6 L7 L8 SCROLL MOUSE BLE（右親指の「SPACE」を押したまま、左親指の「-」を押す）'"
      draw_args: "mona2:'-s BASE SYM NUM NAV L4（左親指の「-」を押したまま、右親指の「SPACE」を押す） MOUSE BLE（右親指の「SPACE」を押したまま、左親指の「-」を押す）'"
      extra_keymap_yaml: "mona2:'keymap-drawer/mona2_combos.yaml'"
      output_folder: "keymap-drawer"
      destination: "both"