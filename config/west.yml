  projects:
    # ── ZMK 本体 ────────────────────────────────────────────────
    # DYA Studio の最新機能 (ランタイムマクロ / ランタイムコンボ) は
    # cormoran さんの custom Studio RPC プロトコルを含む ZMK でしか動かない。
    # `main+dya` は `main+custom-studio-protocol` を包含する DYA 向けブランチで、
    # cormoran/zmk-keyboard-dya2 v2.0 が実際に採用している構成。
    # ベースは ZMK v0.4 系 (Zephyr 4.1) で、旧 `v0.3-branch+dya` (Zephyr 3.5) から
    # メジャーバージョンが上がっている点に注意。
    - name: zmk
      remote: cormoran
      revision: e5c9b6915b56801193e359dd9bad4a167ce0d1b8  # main+dya @ 2026-10-01 (shakupan e34be5e のビルド時点)
      import: app/west.yml

    # ── DYA Studio 共通基盤 ─────────────────────────────────────
    # 設定の永続化レイヤ。runtime-input-processor / runtime-combo /
    # runtime-macro がすべてこの上に乗るため必須。
